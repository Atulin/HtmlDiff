name: Publish to NPM

on:
    workflow_dispatch:
    push:
        branches: ["master"]

permissions:
    contents: write

env:
    CI: true

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - uses: actions/setup-node@v7
              with:
                  node-version: latest
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Install dependencies
              run: bun i --frozen-lockfile

            - name: Run tests
              run: bun test

            - name: Build
              run: bun run build

            - name: Publish to NPM
              run: npm publish
              continue-on-error: true
              env:
                  NPM_CONFIG_TOKEN: ${{ secrets.NPM_SECRET }}
